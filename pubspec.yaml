name: custom_rr
description: A single home for popular Android custom ROMs and recoveries, with links, screenshots, and flashing instructions.
publish_to: 'none'
version: 1.3.4+14

# SPDX-License-Identifier: GPL-3.0-only
homepage: https://github.com/monsiu/Custom-RR
repository: https://github.com/monsiu/Custom-RR
issue_tracker: https://github.com/monsiu/Custom-RR/issues

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  shared_preferences: ^2.3.2
  go_router: ^17.3.0
  http: ^1.2.2
  dynamic_color: ^1.7.0
  xml: ^7.0.1
  qr_flutter: ^4.1.0
  # In-app updater: download the matching split APK from the latest
  # GitHub release and hand it to the system installer.
  dio: ^5.10.0
  device_info_plus: ^13.2.0
  open_filex: ^4.5.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.8
  yaml: ^3.1.2

# Microsoft Store MSIX packaging (see docs/MICROSOFT_STORE_WINDOWS_RELEASE.md).
# identity_name / msix_version are placeholders; CI overrides them with the
# Partner Center identity (MSIX_IDENTITY_NAME / MSIX_PUBLISHER repo variables)
# and the pubspec version. publisher_display_name must byte-match the Partner
# Center account name. trim_logo off keeps Start-menu tiles uncropped;
# install_certificate off stops msix:create prompting interactively on CI.
msix_config:
  display_name: Custom RR
  publisher_display_name: Monsiu Tech
  identity_name: io.github.monsiu.customrr
  msix_version: 1.3.3.0
  logo_path: images/generated/launcher_windows.png
  trim_logo: false
  capabilities: internetClient
  store: false
  install_certificate: false

flutter:
  uses-material-design: true

  assets:
    - assets/catalog.json
    - assets/freshness.json
    - PRIVACY.md
    # Catalog logo artwork (device/brand imageAsset + ROM/recovery headerAsset)
    # is NOT bundled. It is hosted in this repo's images/ folder and loaded over
    # the network with caching (see lib/widgets/brand_image.dart), so adding or
    # correcting a logo only needs a push to the repo, not an app update, the
    # same model as the catalog screenshots. Only app chrome + the generic
    # placeholder stay bundled below.
    - images/branding.png
    - images/launcher.png
    - images/generated/launcher_full.png
    - images/generated/launcher_adaptive_fg.png
    - images/splash_image.png
    - images/screenshots/un1ca/
    - images/screenshots/artisanrom/
